name: Ugglite Kernel and DTB Build

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-kernel-ugglite.sh"
      - ".github/workflows/kernel-build-ugglite.yml"

permissions:
  contents: read

concurrency:
  group: ugglite-kernel-build
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout project scripts
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential clang curl flex git libelf-dev libssl-dev lld llvm python3 rsync
          echo "=== Available disk after cleanup ==="
          df -h "$GITHUB_WORKSPACE"
          FREE_GB="$(df -BG "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub(/G/,"",$4); print $4}')"
          if (( FREE_GB < 8 )); then
            echo "ERROR: less than 8 GiB free disk remains on the GitHub-hosted runner."
            exit 1
          fi

      - name: Install Android Repo launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync Mi-Thorium kernel, DTS and techpack sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel-src"
          cd "$GITHUB_WORKSPACE/kernel-src"
          repo init -u https://github.com/Mi-Thorium/kernel_manifest -b mithorium-4.19 --no-clone-bundle
          repo sync -c --no-clone-bundle -j2

      - name: Configure and build ugglite kernel and DTB
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT="$GITHUB_WORKSPACE" \
          KERNEL_SOURCE="$GITHUB_WORKSPACE/kernel-src/kernel" \
          KERNEL_OUT="$GITHUB_WORKSPACE/kernel-out" \
          KERNEL_ARTIFACT_DIR="$GITHUB_WORKSPACE/kernel-artifacts" \
          JOBS=2 bash scripts/build-kernel-ugglite.sh 2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"

      - name: Verify kernel image, embedded DTB and ugglite config
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-kernel-artifacts.py "$GITHUB_WORKSPACE/kernel-artifacts"

      - name: Upload kernel and DTB artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ugglite-kernel-dtb
          path: |
            kernel-artifacts/*
            kernel-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload kernel build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ugglite-kernel-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 14
