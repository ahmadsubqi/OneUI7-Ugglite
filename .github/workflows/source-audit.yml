name: Source Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/source-audit.yml"
      - "docs/SOURCE-PLAN.md"
      - "scripts/source-audit.sh"

permissions:
  contents: read

concurrency:
  group: source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit MiThorium ugglite sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Show runner metadata
        run: |
          echo "Project: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          uname -a
          git --version

      - name: Check candidate MiThorium repositories
        shell: bash
        run: |
          set -u
          mkdir -p audit
          {
            echo "# MiThorium source audit"
            echo
            echo "Date (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Project ref: ${GITHUB_REF}"
            echo
            while IFS='|' read -r name url; do
              [ -n "$name" ] || continue
              echo "## $name"
              if git ls-remote --heads "$url"; then
                echo
              else
                echo "REMOTE_CHECK_FAILED: $url"
                echo
              fi
            done <<'SOURCES'
          device-tree|https://github.com/Mi-Thorium/android_device_xiaomi_Mi8937.git
          kernel-4.19|https://github.com/Mi-Thorium/kernel_msm-4.19.git
          common-device|https://github.com/Mi-Thorium/android_device_xiaomi_mithorium-common.git
          vendor-device|https://github.com/Mi-Thorium/proprietary_vendor_xiaomi_Mi8937.git
          vendor-common|https://github.com/Mi-Thorium/proprietary_vendor_xiaomi_mithorium-common.git
          vendor-common-4.19|https://github.com/Mi-Thorium/proprietary_vendor_xiaomi_mithorium-common-4.19.git
          local-manifests|https://github.com/Mi-Thorium/local_manifests.git
          SOURCES
          } | tee audit/source-audit.md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: ugglite-source-audit
          path: audit/source-audit.md
          if-no-files-found: error
          retention-days: 14
